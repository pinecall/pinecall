# Temporary, the studio branch alone: Studio's suites on Postgres and Redis, which check.yml's runtime job has no Redis for. Removed before the merge.
name: studio-suite

on:
  push:
    branches: [studio]

permissions:
  contents: read

jobs:
  studio:
    name: runtime · studio, hosting and the calls, on Postgres and Redis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - name: Postgres and Redis, on tmpfs
        run: |
          docker build -t pinecall/postgres ../infra/local/postgres
          docker run -d --name postgres -p 127.0.0.1:5432:5432 --tmpfs /var/lib/postgresql/data \
            -e POSTGRES_USER=pinecall -e POSTGRES_PASSWORD=pinecall -e POSTGRES_DB=pinecall \
            pinecall/postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
          docker run -d --name redis -p 127.0.0.1:6379:6379 redis:7-alpine
          until docker exec postgres pg_isready -U pinecall -d pinecall; do sleep 1; done
          until docker exec redis redis-cli ping; do sleep 1; done
      - run: uv run pytest -q -n auto -rs tests/studio tests/hosting tests/calls tests/app tests/jobs tests/agents
        env:
          DATABASE_URL: postgresql://pinecall:pinecall@127.0.0.1:5432/pinecall
          PINECALL_REDIS_URL: redis://127.0.0.1:6379/0
