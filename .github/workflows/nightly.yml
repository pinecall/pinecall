# The goldens, every weekday night, on the baseline model and on one from another vendor — in
# TypeScript and in Ruby, the same agent and the same eleven goldens in each.
#
# Its own file and not a job of check.yml on purpose: check judges a commit and makes no call,
# while this one spends real money on real calls and only ever runs on main. It runs against the
# one gateway, https://cloud.pinecall.io, in the sandbox of the org whose key it holds: the judges,
# the provider keys and the log are the gateway's, so this job needs no runtime, no database and
# no provider key of its own — only the CLI of this tree and that one key. The agents are the
# framework's example (examples/typescript/clinica-norte) and the Ruby SDK's
# (examples/ruby/clinica_norte).
name: nightly

on:
  # 04:00 in Madrid through the summer and 03:00 through the winter — GitHub's cron is UTC and has
  # no zone. Weekdays only, and seventeen past the hour rather than on it, where every scheduled
  # workflow on the platform queues at once. A schedule only ever runs on the default branch and
  # only ever reads main's copy of this file, which is why the nightly watches what landed.
  schedule:
    - cron: "17 2 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

# One nightly at a time, and never cancelled: a finished run is the record of what two models did
# on a given night, and half a run that was killed says nothing about either of them.
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  goldens:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # The one gateway, both worlds; with no --prod every verb acts in the sandbox.
      PINECALL_URL: https://cloud.pinecall.io
      # A sandbox server token of the org that keeps the example's world: its language, the base
      # `clinica-norte` (its agents/clinica-norte/docs/) is attached as, the models. Read from the environment by the CLI and
      # by nothing else; it is never echoed.
      PINECALL_KEY: ${{ secrets.PINECALL_NIGHTLY_KEY }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Without the key every verb below stops on "no PINECALL_KEY" three steps later. Said here,
      # first, in the words of what is missing.
      - name: the key the night runs on
        run: |
          if [ -z "$PINECALL_KEY" ]; then
            echo "the nightly runs real calls on cloud.pinecall.io and this repository has no key for it:"
            echo "  gh secret set PINECALL_NIGHTLY_KEY --repo pinecall/pinecall   (a sandbox server token)"
            exit 1
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      # The CLI starts the gem's serve entry with `ruby -r pinecall`: the gem is sdk/ruby/lib, on
      # RUBYLIB, and its one dependency is installed where plain `ruby` finds it.
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.2"
      - name: the gem's one dependency
        run: gem install websocket-driver --no-document

      # The CLI this run drives is this tree's, from its sources: cli/bin/pinecall.js needs no
      # build. The example serves through the workspace's @pinecall/agents, the same commit's.
      - run: pnpm install --frozen-lockfile

      # A push replaces the base whole, so the night searches what the repository says: the
      # example's documents, under its slug. Attaching it to the agent is the world's, done once.
      - name: the example's documents, as its base
        working-directory: examples/typescript/clinica-norte
        run: node "$GITHUB_WORKSPACE/cli/bin/pinecall.js" docs push

      # The agent is served by a process the CLI starts for the run, and the gateway drives and
      # judges the conversations. A golden that does not hold is not this step's business: it
      # writes the run down and the gate below reads it, so a red on the second model is a
      # finding in the summary rather than a dead job. The gateway runs one suite at a time per
      # agent, so the two languages run one after the other.
      - name: pinecall test, two models — clinica-norte in TypeScript
        working-directory: examples/typescript/clinica-norte
        run: |
          node "$GITHUB_WORKSPACE/cli/bin/pinecall.js" test \
            --model haiku --model openai/gpt-4.1-mini \
            --json > "$RUNNER_TEMP/clinica-norte.json" || true

      - name: pinecall test, two models — clinica-norte in Ruby
        working-directory: examples/ruby/clinica_norte
        run: |
          RUBYLIB="$GITHUB_WORKSPACE/sdk/ruby/lib" node "$GITHUB_WORKSPACE/cli/bin/pinecall.js" test \
            --model haiku --model openai/gpt-4.1-mini \
            --json > "$RUNNER_TEMP/clinica-norte-ruby.json" || true

      # The matrix as a person reads it, and the one gate: a golden that does not hold on the
      # BASELINE model fails the night. A golden two models disagree about is the whole reason
      # there are two of them, so it is written into the summary as a finding and fails nothing —
      # the answer to a divergence is a fix, never a softened golden.
      - name: the matrices, and the gate on the baseline model
        run: |
          code=0
          for run in clinica-norte clinica-norte-ruby; do
            echo "### $run" >> "$GITHUB_STEP_SUMMARY"
            python3 .github/nightly-summary.py "$RUNNER_TEMP/$run.json" || code=1
          done
          exit "$code"

      # The second gate: each judge's held-rate over the calls the gateway's own log carries, and
      # the delta between two windows is the drift. `if: always()` because a matrix that went red
      # must not hide a judge that has been sliding for a week — the night fails on either.
      - name: the drift watch on call.score
        if: always()
        working-directory: examples/typescript/clinica-norte
        run: |
          code=0
          node "$GITHUB_WORKSPACE/cli/bin/pinecall.js" runs drift \
            --agent clinica-norte --window 7d --baseline 30d --threshold 10 \
            > "$RUNNER_TEMP/drift.txt" || code=$?
          { echo "### drift — clinica-norte"; echo '```'; cat "$RUNNER_TEMP/drift.txt"; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/drift.txt"
          exit "$code"

      # A golden that broke is written out whole under the directory its suite ran in — the golden,
      # every verdict, the call's log and every request the model answered. On a runner it dies
      # with the machine unless it is kept: a fortnight.
      - name: the reproductions of every golden that broke
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reproductions
          path: |
            examples/typescript/*/.pinecall/evals/
            examples/ruby/*/.pinecall/evals/
          if-no-files-found: ignore
          retention-days: 14
          # `.pinecall` is a dot-directory, which upload-artifact skips unless told otherwise.
          include-hidden-files: true
