<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="How a call moves through Pinecall">
<title>How a call moves through Pinecall</title>
<defs>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#000000" stroke-opacity="0.04"/>
  </pattern>
</defs>
<style>
  text { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; }
  .h { font-size: 16px; font-weight: 700; fill: #1f2328; }
  .b { font-size: 13px; fill: #59636e; }
  .lbl { font-size: 10.5px; letter-spacing: 1.5px; }
  .cap { font-size: 11px; letter-spacing: 2px; fill: #59636e; }
  .fl { font-size: 11px; fill: #59636e; }
  .flow { stroke-dasharray: 6 10; animation: run 1.2s linear infinite; }
  .rev { animation-direction: reverse; }
  @keyframes run { to { stroke-dashoffset: -32; } }
</style>
<rect width="1200" height="560" rx="14" fill="#ffffff"/>
<rect width="1200" height="560" rx="14" fill="url(#grid)"/>
<rect x="0.5" y="0.5" width="1199" height="559" rx="14" fill="none" stroke="#d0d7de"/>
<rect x="30" y="70" width="190" height="64" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text class="h" x="46" y="98">01 phone</text>
<text class="b" x="46" y="119">carriers · SIP</text>
<rect x="30" y="162" width="190" height="64" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text class="h" x="46" y="190">02 browser</text>
<text class="b" x="46" y="211">the widget · WebRTC</text>
<rect x="30" y="254" width="190" height="64" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text class="h" x="46" y="282">03 chat</text>
<text class="b" x="46" y="303">a written call</text>
<rect x="30" y="346" width="190" height="64" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text class="h" x="46" y="374">04 WhatsApp</text>
<text class="b" x="46" y="395">Meta's API</text>
<text class="cap" x="30" y="50">THE DOORS</text>
<rect x="290" y="70" width="250" height="156" rx="10" fill="#f6f8fa" stroke="#6e5fd0" stroke-width="1.5"/>
<text class="lbl" x="304" y="92" fill="#6e5fd0">MEDIA · ONE JOB PER CALL</text>
<text class="h" x="304" y="116">worker</text>
<text class="b" x="304" y="140">LiveKit&#160;AgentSession</text>
<text class="b" x="304" y="160">STT&#160;→&#160;LLM&#160;→&#160;TTS</text>
<text class="b" x="304" y="180">every&#160;turn,&#160;tool&#160;call&#160;and</text>
<text class="b" x="304" y="200">metric:&#160;an&#160;entry</text>
<rect x="610" y="70" width="270" height="250" rx="10" fill="#f6f8fa" stroke="#6e5fd0" stroke-width="1.5"/>
<text class="lbl" x="624" y="92" fill="#6e5fd0">ONE NAME · TWO ENVS</text>
<text class="h" x="624" y="116">gateway</text>
<text class="b" x="624" y="140">the&#160;API&#160;and&#160;every&#160;socket</text>
<text class="b" x="624" y="160">keys&#160;·&#160;scopes&#160;·&#160;row-level</text>
<text class="b" x="624" y="180">security&#160;per&#160;org</text>
<text class="b" x="624" y="200">the&#160;call's&#160;log:&#160;every&#160;fact</text>
<text class="b" x="624" y="220">appended,&#160;nothing&#160;rewritten</text>
<text class="b" x="624" y="240">judges&#160;at&#160;hang-up</text>
<text class="b" x="624" y="260">quotas&#160;·&#160;usage&#160;·&#160;alerts</text>
<rect x="970" y="70" width="200" height="200" rx="10" fill="#f6f8fa" stroke="#1a7f37" stroke-width="1.5"/>
<text class="lbl" x="984" y="92" fill="#1a7f37">TS · PYTHON · RUBY</text>
<text class="h" x="984" y="116">your app</text>
<text class="b" x="984" y="140">class&#160;FrontDesk</text>
<text class="b" x="984" y="160">&#160;&#160;extends&#160;Agent</text>
<text class="b" x="984" y="180">state&#160;&#160;=&#160;fields</text>
<text class="b" x="984" y="200">verbs&#160;&#160;=&#160;@tool</text>
<text class="b" x="984" y="220">prompt&#160;=&#160;render()</text>
<path d="M625 392 a85 12 0 0 0 170 0 v60 a85 12 0 0 1 -170 0 z" fill="#f6f8fa" stroke="#d0d7de"/>
<ellipse cx="710" cy="392" rx="85" ry="12" fill="#f6f8fa" stroke="#d0d7de"/>
<text class="h" x="710" y="428" text-anchor="middle">Postgres</text>
<text class="b" x="710" y="448" text-anchor="middle">logs · facts · usage</text>
<rect x="815" y="384" width="100" height="74" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text class="h" x="865" y="416" text-anchor="middle">Redis</text>
<text class="b" x="865" y="436" text-anchor="middle">the signal</text>
<rect x="290" y="384" width="290" height="74" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text class="h" x="306" y="414">console · CLI · MCP</text>
<text class="b" x="306" y="436">read the log live, move on a call</text>
<path d="M220 102 C255 102 255 130 290 130" fill="none" stroke="#d0d7de" stroke-width="2"/>
<path class="flow" d="M220 102 C255 102 255 130 290 130" fill="none" stroke="#0d9488" stroke-width="2"/>
<path d="M220 194 C255 194 255 170 290 170" fill="none" stroke="#d0d7de" stroke-width="2"/>
<path class="flow" d="M220 194 C255 194 255 170 290 170" fill="none" stroke="#0d9488" stroke-width="2"/>
<path d="M220 286 C420 286 420 250 610 250" fill="none" stroke="#d0d7de" stroke-width="2"/>
<path class="flow" d="M220 286 C420 286 420 250 610 250" fill="none" stroke="#0d9488" stroke-width="2"/>
<path d="M220 378 C440 378 440 280 610 280" fill="none" stroke="#d0d7de" stroke-width="2"/>
<path class="flow" d="M220 378 C440 378 440 280 610 280" fill="none" stroke="#0d9488" stroke-width="2"/>
<path d="M540 148 L610 148" fill="none" stroke="#d0d7de" stroke-width="2"/>
<path class="flow" d="M540 148 L610 148" fill="none" stroke="#0d9488" stroke-width="2"/>
<text class="fl" x="575" y="138" text-anchor="middle">entries</text>
<path d="M880 150 L970 150" fill="none" stroke="#d0d7de" stroke-width="2"/>
<path class="flow" d="M880 150 L970 150" fill="none" stroke="#1a7f37" stroke-width="2"/>
<text class="fl" x="925" y="140" text-anchor="middle">tool.call</text>
<path d="M970 190 L880 190" fill="none" stroke="#d0d7de" stroke-width="2"/>
<path class="flow" d="M970 190 L880 190" fill="none" stroke="#1a7f37" stroke-width="2"/>
<text class="fl" x="925" y="210" text-anchor="middle">tool.result</text>
<path d="M710 320 L710 380" fill="none" stroke="#d0d7de" stroke-width="2"/>
<path class="flow" d="M710 320 L710 380" fill="none" stroke="#0d9488" stroke-width="2"/>
<path d="M865 320 L865 384" fill="none" stroke="#d0d7de" stroke-width="2"/>
<path class="flow" d="M865 320 L865 384" fill="none" stroke="#0d9488" stroke-width="2"/>
<path d="M610 300 C590 300 590 420 580 420" fill="none" stroke="#d0d7de" stroke-width="2"/>
<path class="flow rev" d="M610 300 C590 300 590 420 580 420" fill="none" stroke="#0d9488" stroke-width="2"/>
<text class="cap" x="970" y="300">THE APP SOCKET</text>
<text class="b" x="970" y="322">your process holds the class;</text>
<text class="b" x="970" y="342">the gateway asks it to act</text>
<text class="cap" x="30" y="520">EVERY FACT OF A CALL IS AN ENTRY IN ITS LOG · STATE, USAGE AND SCORES ARE FOLDED FROM IT</text>
</svg>
