<text class="tag" x="600" y="183" text-anchor="middle">VOICE &amp; CHAT AGENTS, WRITTEN AS A CLASS</text>
<rect x="24" y="232" width="564" height="332" rx="8" fill="#0b0f14" stroke="#21262d"/><rect x="612" y="232" width="564" height="332" rx="8" fill="#0b0f14" stroke="#7ee787" stroke-opacity=".45"/><text class="pane" x="574" y="224" text-anchor="end">0:runtime</text><text class="pane" x="1162" y="224" text-anchor="end">1:agent*</text>
<text class="line" xml:space="preserve" style="animation: l1 24.8s linear infinite" x="42" y="262"><tspan class="note"># the runtime, on this machine: open source, no account</tspan></text><text class="line" xml:space="preserve" style="animation: l2 24.8s linear infinite" x="42" y="288"><tspan class="dollar">$ </tspan><tspan class="cmd">uv tool install "pinecall-runtime[voice]"</tspan></text><text class="line" xml:space="preserve" style="animation: l3 24.8s linear infinite" x="42" y="314"><tspan class="dollar">$ </tspan><tspan class="cmd">pinecall-runtime setup</tspan></text><text class="line" xml:space="preserve" style="animation: l4 24.8s linear infinite" x="42" y="340"><tspan class="out">docker     compose 2.39.1</tspan></text><text class="line" xml:space="preserve" style="animation: l5 24.8s linear infinite" x="42" y="366"><tspan class="out">services   Postgres :55433 · Redis :56380 · LiveKit :7880</tspan></text><text class="line" xml:space="preserve" style="animation: l6 24.8s linear infinite" x="42" y="392"><tspan class="ask">console sign-in: your email: </tspan><tspan class="cmd" style="animation: a6 24.8s linear infinite">you@acme.dev</tspan></text><text class="line" xml:space="preserve" style="animation: l7 24.8s linear infinite" x="42" y="418"><tspan class="ask">password: </tspan><tspan class="cmd" style="animation: a7 24.8s linear infinite">••••••••••</tspan></text><text class="line" xml:space="preserve" style="animation: l8 24.8s linear infinite" x="42" y="444"><tspan class="ask">models: local · keys · none [local]: </tspan><tspan class="cmd" style="animation: a8 24.8s linear infinite">local</tspan></text><text class="line" xml:space="preserve" style="animation: l9 24.8s linear infinite" x="42" y="470"><tspan class="out">models     Ollama · Whisper · Kokoro · bge-m3, local</tspan></text><text class="line" xml:space="preserve" style="animation: l10 24.8s linear infinite" x="42" y="496"><tspan class="out">key        yours, handed to the CLI: no login, no link</tspan></text><text class="line" xml:space="preserve" style="animation: l11 24.8s linear infinite" x="42" y="522"><tspan class="log">ready      console http://127.0.0.1:8080/sandbox/</tspan></text><text class="line" xml:space="preserve" style="animation: l12 24.8s linear infinite" x="630" y="262"><tspan class="note"># an agent, written as a class</tspan></text><text class="line" xml:space="preserve" style="animation: l13 24.8s linear infinite" x="630" y="288"><tspan class="dollar">$ </tspan><tspan class="cmd">npm i -g pinecall</tspan></text><text class="line" xml:space="preserve" style="animation: l14 24.8s linear infinite" x="630" y="314"><tspan class="dollar">$ </tspan><tspan class="cmd">pinecall new acme --agent front-desk &amp;&amp; cd acme</tspan></text><text class="line" xml:space="preserve" style="animation: l15 24.8s linear infinite" x="630" y="340"><tspan class="dollar">$ </tspan><tspan class="cmd">npm install</tspan></text><text class="line" xml:space="preserve" style="animation: l16 24.8s linear infinite" x="630" y="366"><tspan class="dollar">$ </tspan><tspan class="cmd">pinecall chat</tspan><tspan class="note">  # talk to it, on your machine</tspan></text><text class="line" xml:space="preserve" style="animation: l17 24.8s linear infinite" x="630" y="392"><tspan class="dollar">$ </tspan><tspan class="cmd">pinecall test</tspan><tspan class="note">  # its goldens, judged locally</tspan></text><text class="line" xml:space="preserve" style="animation: l18 24.8s linear infinite" x="630" y="418"><tspan class="dollar">$ </tspan><tspan class="cmd">pinecall start</tspan><tspan class="note">  # answer calls: the console rings</tspan></text><text class="line" xml:space="preserve" style="animation: l19 24.8s linear infinite" x="630" y="444"><tspan class="note"># or Pinecall Cloud, with no machine of yours</tspan></text><text class="line" xml:space="preserve" style="animation: l20 24.8s linear infinite" x="630" y="470"><tspan class="dollar">$ </tspan><tspan class="cmd">pinecall login</tspan></text><text class="line" xml:space="preserve" style="animation: l21 24.8s linear infinite" x="630" y="496"><tspan class="dollar">$ </tspan><tspan class="cmd">pinecall link</tspan></text><text class="line" xml:space="preserve" style="animation: l22 24.8s linear infinite" x="630" y="522"><tspan class="dollar">$ </tspan><tspan class="cmd">pinecall deploy up</tspan></text>
<g style="opacity:0;animation: prompt 24.8s linear infinite"><text class="line" style="opacity:1" x="630" y="548"><tspan class="dollar">$ </tspan></text><rect class="cursor" x="648" y="533" width="9" height="19"/></g>
<rect x="0" y="620" width="1200" height="30" fill="#7ee787" fill-opacity=".12"/><text class="status" x="24" y="640"><tspan class="statusk">[pinecall]</tspan> 0:runtime  1:agent*</text><text class="status" x="1176" y="640" text-anchor="end">Apache-2.0 · your machine or cloud.pinecall.io</text>
</g>
