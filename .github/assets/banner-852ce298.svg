<text class="tag" x="600" y="177" text-anchor="middle">VOICE &amp; CHAT AGENTS, WRITTEN AS A CLASS</text>
<rect x="24" y="211" width="1152" height="442" rx="8" fill="#0b0f14" stroke="#21262d"/>
<circle cx="46" cy="229" r="5.5" fill="#ff5f57"/><circle cx="64" cy="229" r="5.5" fill="#febc2e"/><circle cx="82" cy="229" r="5.5" fill="#28c840"/>
<text class="title" x="600" y="233" text-anchor="middle">~/acme</text>
<text class="line" xml:space="preserve" style="animation: l0 20.0s linear infinite" x="48" y="259"><tspan class="note"># the runtime on your machine: open source, open models, no account</tspan></text>
<text class="line" xml:space="preserve" style="animation: l1 20.0s linear infinite" x="48" y="285"><tspan class="dollar">$ </tspan><tspan class="cmd">uv tool install "pinecall-runtime[voice]"</tspan></text>
<text class="line" xml:space="preserve" style="animation: l2 20.0s linear infinite" x="48" y="311"><tspan class="dollar">$ </tspan><tspan class="cmd">pinecall-runtime setup</tspan></text>
<text class="line" xml:space="preserve" style="animation: l3 20.0s linear infinite" x="48" y="337"><tspan class="out">models     Ollama :11434 (bge-m3, gemma4:12b) · Whisper :8000 · Kokoro :8880</tspan></text>
<text class="line" xml:space="preserve" style="animation: l4 20.0s linear infinite" x="48" y="363"><tspan class="out">signed in  this machine: the pinecall CLI here needs no login</tspan></text>
<text class="line" xml:space="preserve" style="animation: l5 20.0s linear infinite" x="48" y="389"><tspan class="ok">ready      console http://127.0.0.1:8080/sandbox/</tspan></text>
<text class="line" xml:space="preserve" style="animation: l6 20.0s linear infinite" x="48" y="415"><tspan class="dollar">$ </tspan><tspan class="cmd">npm i -g pinecall &amp;&amp; pinecall new acme --agent front-desk &amp;&amp; cd acme</tspan></text>
<text class="line" xml:space="preserve" style="animation: l7 20.0s linear infinite" x="48" y="441"><tspan class="dollar">$ </tspan><tspan class="cmd">pinecall chat</tspan></text>
<text class="line" xml:space="preserve" style="animation: l8 20.0s linear infinite" x="48" y="467"><tspan class="out">› Hello, this is Acme. How can I help you today?</tspan></text>
<text class="line" xml:space="preserve" style="animation: l9 20.0s linear infinite" x="48" y="493"><tspan class="dollar">$ </tspan><tspan class="cmd">pinecall test</tspan></text>
<text class="line" xml:space="preserve" style="animation: l10 20.0s linear infinite" x="48" y="519"><tspan class="ok">✓ takes-the-message   ✓ books-a-visit</tspan></text>
<text class="line" xml:space="preserve" style="animation: l11 20.0s linear infinite" x="48" y="545"><tspan class="dollar">$ </tspan><tspan class="cmd">pinecall start</tspan></text>
<text class="line" xml:space="preserve" style="animation: l12 20.0s linear infinite" x="48" y="571"><tspan class="ok">front-desk · default · sandbox · connected to http://127.0.0.1:8080 · tools 4</tspan></text>
<text class="line" xml:space="preserve" style="animation: l13 20.0s linear infinite" x="48" y="597"><tspan class="note"># or Pinecall Cloud, nothing to run: pinecall login</tspan></text>
<g style="opacity:0;animation: prompt 20.0s linear infinite"><text class="line" style="opacity:1" x="48" y="623"><tspan class="dollar">$ </tspan></text><rect class="cursor" x="66" y="608" width="9" height="19"/></g>
</g>
