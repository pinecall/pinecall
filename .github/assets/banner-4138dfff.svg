<text class="tag" x="600" y="183" text-anchor="middle">VOICE &amp; CHAT AGENTS, WRITTEN AS A CLASS</text>
<rect x="24" y="232" width="564" height="316" rx="8" fill="#0b0f14" stroke="#21262d"/><rect x="612" y="232" width="564" height="316" rx="8" fill="#0b0f14" stroke="#7ee787" stroke-opacity=".45"/><text class="pane" x="574" y="224" text-anchor="end">0:runtime</text><text class="pane" x="1162" y="224" text-anchor="end">1:agent*</text>
<text class="line" style="animation: l1 22.5s linear infinite" x="42" y="266"><tspan class="note"># the runtime, on this machine: open source, no account</tspan></text><text class="line" style="animation: l2 22.5s linear infinite" x="42" y="295"><tspan class="dollar">$ </tspan><tspan class="cmd">uv tool install "pinecall-runtime[voice]"</tspan></text><text class="line" style="animation: l3 22.5s linear infinite" x="42" y="324"><tspan class="dollar">$ </tspan><tspan class="cmd">pinecall-runtime local up</tspan></text><text class="line" style="animation: l4 22.5s linear infinite" x="42" y="353"><tspan class="out">local · Postgres :55433 · Redis :56380 · LiveKit :7880</tspan></text><text class="line" style="animation: l5 22.5s linear infinite" x="42" y="382"><tspan class="out">console   http://127.0.0.1:8080/sandbox/</tspan></text><text class="line" style="animation: l6 22.5s linear infinite" x="42" y="411"><tspan class="out">gateway and a sandbox worker running; Ctrl-C stops them</tspan></text><text class="line" style="animation: l7 22.5s linear infinite" x="42" y="440"><tspan class="log">gateway | INFO ...</tspan></text><text class="line" style="animation: l8 22.5s linear infinite" x="42" y="469"><tspan class="log">worker  | INFO ...</tspan></text><text class="line" style="animation: l9 22.5s linear infinite" x="630" y="266"><tspan class="note"># an agent, written as a class</tspan></text><text class="line" style="animation: l10 22.5s linear infinite" x="630" y="295"><tspan class="dollar">$ </tspan><tspan class="cmd">npm i -g pinecall</tspan></text><text class="line" style="animation: l11 22.5s linear infinite" x="630" y="324"><tspan class="dollar">$ </tspan><tspan class="cmd">pinecall new acme --agent front-desk</tspan></text><text class="line" style="animation: l12 22.5s linear infinite" x="630" y="353"><tspan class="dollar">$ </tspan><tspan class="cmd">pinecall login http://127.0.0.1:8080</tspan></text><text class="line" style="animation: l13 22.5s linear infinite" x="630" y="382"><tspan class="dollar">$ </tspan><tspan class="cmd">pinecall chat</tspan><tspan class="note">  # talk to it</tspan></text><text class="line" style="animation: l14 22.5s linear infinite" x="630" y="411"><tspan class="dollar">$ </tspan><tspan class="cmd">pinecall test</tspan><tspan class="note">  # goldens, a real model</tspan></text><text class="line" style="animation: l15 22.5s linear infinite" x="630" y="440"><tspan class="note"># or on Pinecall Cloud, with no machine of yours</tspan></text><text class="line" style="animation: l16 22.5s linear infinite" x="630" y="469"><tspan class="dollar">$ </tspan><tspan class="cmd">pinecall login</tspan></text><text class="line" style="animation: l17 22.5s linear infinite" x="630" y="498"><tspan class="dollar">$ </tspan><tspan class="cmd">pinecall deploy up</tspan></text>
<g style="opacity:0;animation: prompt 22.5s linear infinite"><text class="line" style="opacity:1" x="630" y="527"><tspan class="dollar">$ </tspan></text><rect class="cursor" x="648" y="512" width="9" height="19"/></g>
<rect x="0" y="590" width="1200" height="30" fill="#7ee787" fill-opacity=".12"/><text class="status" x="24" y="610"><tspan class="statusk">[pinecall]</tspan> 0:runtime  1:agent*</text><text class="status" x="1176" y="610" text-anchor="end">Apache-2.0 · your machine or cloud.pinecall.io</text>
</g>
