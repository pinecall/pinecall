<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="Pinecall: voice and chat agents written as a class; the runtime on your machine, or on Pinecall Cloud">
<title>Pinecall</title>
