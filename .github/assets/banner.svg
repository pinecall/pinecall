  .dollar { fill: #7ee787; }
  .cmd { fill: #e6edf3; }
  .note { fill: #6e7681; }
  .out { fill: #b9adff; }
  .cursor { fill: #7ee787; opacity: 0; animation: blink 1s step-end 4.20s infinite; }
  .title { font: 13px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #6e7681; }
  .tag { font: 15px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #8b949e; letter-spacing: 3px; }
  @keyframes on { to { opacity: 1; } }
  @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
</style>
