<text class="line" style="animation-delay:0.90s" x="96" y="228"><tspan class="dollar">$ </tspan><tspan class="cmd">npm i -g pinecall</tspan></text><text class="line" style="animation-delay:1.45s" x="96" y="262"><tspan class="dollar">$ </tspan><tspan class="cmd">pinecall new acme --agent front-desk</tspan></text><text class="line" style="animation-delay:2.00s" x="96" y="296"><tspan class="out">  ▸ acme · a TypeScript project · agents/front-desk/</tspan></text><text class="line" style="animation-delay:2.55s" x="96" y="330"><tspan class="dollar">$ </tspan><tspan class="cmd">pinecall chat</tspan><tspan class="note">  # talk to it here</tspan></text><text class="line" style="animation-delay:3.10s" x="96" y="364"><tspan class="dollar">$ </tspan><tspan class="cmd">pinecall test</tspan><tspan class="note">  # its goldens, against a real model</tspan></text><text class="line" style="animation-delay:3.65s" x="96" y="398"><tspan class="dollar">$ </tspan><tspan class="cmd">pinecall deploy up</tspan><tspan class="note">  # it answers calls on Pinecall</tspan></text>
