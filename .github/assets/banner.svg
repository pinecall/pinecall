<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="Pinecall: voice and chat agents written as a class">
<title>Pinecall</title>
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
