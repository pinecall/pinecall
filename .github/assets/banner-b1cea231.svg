<text class="line dim" xml:space="preserve" style="opacity:0;animation: l2 17.35s linear infinite" x="48" y="313">  this machine   no GPU · 16.0 GB RAM · 8 cores · Docker ✓</text>
<text class="line dim" xml:space="preserve" style="opacity:0;animation: l3 17.35s linear infinite" x="48" y="339">  the stack that fits it</text>
<text class="line out" xml:space="preserve" style="opacity:0;animation: l4 17.35s linear infinite" x="48" y="365">    ears      deepgram     DEEPGRAM_API_KEY in the environment</text>
<text class="line out" xml:space="preserve" style="opacity:0;animation: l5 17.35s linear infinite" x="48" y="391">    turn      stt          the ears' own endpointing</text>
<text class="line out" xml:space="preserve" style="opacity:0;animation: l6 17.35s linear infinite" x="48" y="417">    thinking  anthropic    ANTHROPIC_API_KEY in ~/.zshrc</text>
<text class="line out" xml:space="preserve" style="opacity:0;animation: l7 17.35s linear infinite" x="48" y="443">    voice     cartesia     CARTESIA_API_KEY not found: asked when you press Enter</text>
<text class="line" xml:space="preserve" style="opacity:0;animation: l8 17.35s linear infinite" x="64.9" y="469"><tspan class="ask">Enter runs it, or a stage to change: </tspan><tspan class="cmd" style="fill-opacity:0;animation: a8 17.35s linear infinite">⏎</tspan></text>
<text class="line" xml:space="preserve" style="opacity:0;animation: l9 17.35s linear infinite" x="64.9" y="495"><tspan class="ask">CARTESIA_API_KEY: </tspan><tspan class="cmd" style="fill-opacity:0;animation: a9 17.35s linear infinite">••••••••••••</tspan></text>
<text class="line dim" xml:space="preserve" style="opacity:0;animation: l10 17.35s linear infinite" x="48" y="521">services   Postgres :55433 · Redis :56380 · LiveKit :7880</text>
<text class="line" xml:space="preserve" style="opacity:0;animation: l11 17.35s linear infinite" x="64.9" y="547"><tspan class="ask">console sign-in, your email: </tspan><tspan class="cmd" style="fill-opacity:0;animation: a11 17.35s linear infinite">you@acme.dev</tspan></text>
<text class="line" xml:space="preserve" style="opacity:0;animation: l12 17.35s linear infinite" x="64.9" y="573"><tspan class="ask">password: </tspan><tspan class="cmd" style="fill-opacity:0;animation: a12 17.35s linear infinite">••••••••••</tspan></text>
<text class="line out" xml:space="preserve" style="opacity:0;animation: l13 17.35s linear infinite" x="48" y="599">signed in  this machine: the pinecall CLI here needs no login</text>
<text class="line ok" xml:space="preserve" style="opacity:0;animation: l14 17.35s linear infinite" x="48" y="625">ready      console http://127.0.0.1:8080/sandbox/</text>
<text class="line note" xml:space="preserve" style="opacity:0;animation: l15 17.35s linear infinite" x="48" y="651">gateway and a sandbox worker running; Ctrl-C stops them</text>
