# The cloud's secret store, read as the identity External Secrets runs as. A store of this chart's own, not
# charts/pinecall's: this chart is released first, and charts/pinecall's migrations (a pre-install
# hook, run before any of its resources exist) wait for the role the secret below makes.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: pinecall-postgres
spec:
  {{- if not .Values.secrets.provider }}
  {{- fail "secrets.provider: the secret store's provider block (gcpsm, aws, vault…), as External Secrets takes it" }}
  {{- end }}
  provider:
    {{- toYaml .Values.secrets.provider | nindent 4 }}
---
# The gateway's role's password, from the secret store, as CloudNativePG reads a managed role's
# (basic-auth: username, password) and with the URI the gateway connects by beside it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.postgres.appSecret }}
spec:
  refreshInterval: {{ .Values.secrets.refresh }}
  secretStoreRef: { kind: ClusterSecretStore, name: pinecall-postgres }
  target:
    name: {{ .Values.postgres.appSecret }}
    template:
      type: kubernetes.io/basic-auth
      # CloudNativePG watches a secret so labelled: the role is made the moment this one lands
      # (on 2026-10-07 it waited for a nudge to the Cluster), and a new password is applied by it.
      metadata:
        labels: { cnpg.io/reload: "true" }
      data:
        username: {{ .Values.postgres.appRole }}
        password: "{{`{{ .password }}`}}"
        uri: "postgresql://{{ .Values.postgres.appRole }}:{{`{{ .password }}`}}@pinecall-postgres-rw:5432/pinecall"
  data:
    - secretKey: password
      remoteRef: { key: {{ printf "%spostgres-app-password" .Values.secrets.prefix | quote }} }
