{{- if .Values.kubeip.identity }}
# kubeip on each env's media node: it gives the node the env's static address modules/edge
# reserved (found by its label), and gives it again to a node that replaces it; the env's LiveKit
# and SIP announce that address.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pinecall-kubeip
  annotations:
    iam.gke.io/gcp-service-account: {{ .Values.kubeip.identity | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pinecall-kubeip
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create, get, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pinecall-kubeip
subjects:
  - { kind: ServiceAccount, name: pinecall-kubeip, namespace: {{ .Release.Namespace }} }
roleRef: { kind: ClusterRole, name: pinecall-kubeip, apiGroup: rbac.authorization.k8s.io }
{{- range $env, $_ := .Values.envs }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: pinecall-kubeip-{{ $env }}
spec:
  selector: { matchLabels: { app: pinecall-kubeip, world: {{ $env }} } }
  template:
    metadata: { labels: { app: pinecall-kubeip, world: {{ $env }} } }
    spec:
      serviceAccountName: pinecall-kubeip
      {{- include "pinecall.onMedia" $env | nindent 6 }}
      terminationGracePeriodSeconds: 30
      # The image's own user (distroless, 1001), said here so the cluster holds it to it.
      {{- include "pinecall.podSecurityAs" 1001 | nindent 6 }}
      containers:
        - name: kubeip
          image: {{ $.Values.media.kubeip }}
          {{- include "pinecall.containerSecurity" $ | nindent 10 }}
          env:
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: FILTER
              value: {{ printf "labels.pinecall-media=%s-%s" (required "cluster" $.Values.cluster) $env | quote }}
          resources:
            requests: { cpu: 10m, memory: 32Mi }
{{- end }}
{{- end }}
