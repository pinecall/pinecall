# The schema before anything new runs: a hook, so no pod of the release starts on an old one.
# The doctor is not a hook yet: its `archive` line reads the box's WAL spool through Postgres, which
# a cluster's Postgres (CloudNativePG, no superuser) has not; that line is a decision of v1's.
apiVersion: batch/v1
kind: Job
metadata:
  name: pinecall-migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 2
  template:
    metadata: { labels: { pinecall.io/reaches-postgres: "true" } }
    spec:
      restartPolicy: Never
      {{- include "pinecall.podSecurity" . | nindent 6 }}
      containers:
        - name: migrate
          image: {{ include "pinecall.image" . }}
          args: ["migrate", "up"]
          {{- include "pinecall.containerSecurity" . | nindent 10 }}
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.postgres.secret }}, key: uri } }
            # Granted every table's rows after the migrations, each release: the gateway's role.
            - name: PINECALL_DB_APP_ROLE
              value: {{ .Values.postgres.appRole | quote }}
          volumeMounts:
            {{- include "pinecall.scratchMounts" . | nindent 12 }}
      volumes:
        {{- include "pinecall.scratchVolumes" . | nindent 8 }}
