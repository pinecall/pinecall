# Each env's workers, on that env's machines alone. On its media node, a few small ones: the
# calls of a quiet hour cost nothing more. On its workers pool, the ones KEDA scales from none on
# the gateway's own number
# (GET /v1/fleet/wanted, fleet/demand.py, counting the core's seats first); the
# cluster autoscaler makes a node for each and takes it away once it is empty. A worker told to
# stop drains its calls, up to ten minutes: Kubernetes waits fifteen. The pod itself is
# pinecall.worker (_worker.tpl).
{{- range $env, $settings := .Values.envs }}
{{- $core := $settings.workers.core }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-core-{{ $env }}
spec:
  replicas: {{ $core.replicas }}
  selector: { matchLabels: { app: worker, world: {{ $env }}, pool: core } }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata: { labels: { app: worker, world: {{ $env }}, pool: core } }
    spec:
      {{- include "pinecall.onMedia" $env | nindent 6 }}
      {{- include "pinecall.worker" (dict "root" $ "env" $env "pool" "core" "seats" $core.seats) | nindent 6 }}
{{- end }}
{{- range $env, $settings := .Values.envs }}
{{- $scaled := $settings.workers.scaled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-scaled-{{ $env }}
# No replicas here: KEDA owns them, and a release that named them would undo its last decision.
spec:
  selector: { matchLabels: { app: worker, world: {{ $env }}, pool: workers } }
  template:
    metadata: { labels: { app: worker, world: {{ $env }}, pool: workers } }
    spec:
      nodeSelector: { pinecall.io/pool: workers-{{ $env }} }
      tolerations:
        - { key: pinecall.io/pool, operator: Equal, value: workers-{{ $env }}, effect: NoSchedule }
      {{- include "pinecall.worker" (dict "root" $ "env" $env "pool" "workers" "seats" $scaled.seats) | nindent 6 }}
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: worker-scaled-{{ $env }}
spec:
  secretTargetRef:
    # The world's fleet key, not the operator's: the one number is all KEDA reads.
    - { parameter: token, name: pinecall-fleets, key: {{ $env }} }
---
# The gateway computes how many; KEDA keeps the Deployment at it: up at once, down one at a time,
# never sooner than ten minutes after the last change, each going only once its calls end; never
# under `min`, a worker kept warm for a burst that cannot wait for a node (0 unless the values say).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-scaled-{{ $env }}
spec:
  scaleTargetRef: { name: worker-scaled-{{ $env }} }
  minReplicaCount: {{ $scaled.min | default 0 }}
  maxReplicaCount: {{ $scaled.most }}
  pollingInterval: 15
  cooldownPeriod: 600
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
        scaleDown:
          stabilizationWindowSeconds: 600
          policies: [{ type: Pods, value: 1, periodSeconds: 300 }]
  triggers:
    - type: metrics-api
      metricType: AverageValue
      authenticationRef: { name: worker-scaled-{{ $env }} }
      metadata:
        # KEDA asks from its own namespace: the gateway's Service by its whole name.
        url: {{ printf "http://pinecall-gateway.%s.svc.cluster.local:8080/v1/fleet/wanted?scaled=worker-scaled-%s-&seats=%v&most=%v" $.Release.Namespace $env $scaled.seats $scaled.most | quote }}
        valueLocation: wanted
        targetValue: "1"
        authMode: bearer
{{- end }}
