# Each env's LiveKit and its SIP talk through a Redis of their own, on the env's media node:
# Redis's pub/sub is one per server, whatever database a client picks, so a LiveKit sharing one
# with the other env's would answer that env's SIP (and refuse its numbers). LiveKit keeps the
# env's SIP trunks and dispatch rules in it, so it is written to a disk that outlives the node:
# a media node replaced comes back with its numbers. Its label is not the core Redis's: that
# Service selects by `app: pinecall-redis`, and would hand the gateways' connections to these too.
{{- range $env, $_ := .Values.envs }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pinecall-redis-{{ $env }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with $.Values.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pinecall-redis-{{ $env }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: pinecall-media-redis, world: {{ $env }} } }
  template:
    metadata: { labels: { app: pinecall-media-redis, world: {{ $env }} } }
    spec:
      {{- include "pinecall.onMedia" $env | nindent 6 }}
      # The image's own user, and the disk made its (fsGroup: a disk written as root before is
      # given to it at mount); its config file is written to an emptyDir, the rest is read-only.
      {{- include "pinecall.podSecurityAs" 999 | nindent 6 }}
        fsGroup: 999
      containers:
        - name: redis
          image: {{ $.Values.media.redis }}
          args: ["sh", "-c", 'umask 077; printf "requirepass %s\n" "$REDIS_PASSWORD" > /tmp/redis.conf; exec redis-server /tmp/redis.conf --save "" --appendonly yes --dir /data']
          {{- include "pinecall.containerSecurity" $ | nindent 10 }}
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: pinecall, key: REDIS_PASSWORD } }
          ports: [{ containerPort: 6379 }]
          readinessProbe:
            exec: { command: ["sh", "-c", 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping | grep -q PONG'] }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: pinecall-redis-{{ $env }} }
        - { name: tmp, emptyDir: { sizeLimit: 16Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: pinecall-redis-{{ $env }}
spec:
  selector: { app: pinecall-media-redis, world: {{ $env }} }
  ports: [{ port: 6379 }]
{{- end }}
