# A runner per env: it asks the box which apps its env wants, starts and stops their pods in
# the apps' namespace, and serves their releases' sources to them. Its key is read off the cloud's
# secret store and mounted as a file, never in a value here: by External Secrets where
# `secrets.provider` names the store, else by GKE's own driver as the identity modules/hosting made.
{{- $synced := not (empty .Values.secrets.provider) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runner
  {{- if not $synced }}
  annotations:
    iam.gke.io/gcp-service-account: {{ required "serviceAccount" .Values.serviceAccount | quote }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: runner
  namespace: {{ .Values.appsNamespace }}
rules:
  # A release started again finds its secret already there and replaces it (PUT), so update too:
  # without it a restart of a running app, the cluster's or the runner's, left the app down.
  - apiGroups: [""]
    resources: [pods, secrets]
    verbs: [create, delete, get, list, update]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runner
  namespace: {{ .Values.appsNamespace }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: runner }
subjects:
  - { kind: ServiceAccount, name: runner, namespace: {{ .Release.Namespace }} }
{{- if $synced }}
---
# A store of this chart's own, as charts/postgres has one: it is released apart from the runtime's.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: pinecall-hosting
spec:
  provider:
    {{- toYaml .Values.secrets.provider | nindent 4 }}
{{- end }}
{{- range $env, $runner := .Values.envs }}
---
{{- if $synced }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: runner-key-{{ $env }}
spec:
  refreshInterval: {{ $.Values.secrets.refresh }}
  secretStoreRef: { kind: ClusterSecretStore, name: pinecall-hosting }
  target:
    name: runner-key-{{ $env }}
  data:
    - secretKey: key
      remoteRef: { key: {{ printf "%srunner-key-%s" (required "secretPrefix" $.Values.secretPrefix) $env | quote }} }
{{- else }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: runner-key-{{ $env }}
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/{{ required "project" $.Values.project }}/secrets/{{ required "secretPrefix" $.Values.secretPrefix }}runner-key-{{ $env }}/versions/latest"
        path: "key"
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: runner-{{ $env }}
spec:
  replicas: 1
  # One runner a world at a time: two would start every app twice.
  strategy: { type: Recreate }
  selector: { matchLabels: { app: runner, world: {{ $env }} } }
  template:
    metadata: { labels: { app: runner, world: {{ $env }} } }
    spec:
      serviceAccountName: runner
      {{- with $.Values.pool }}
      nodeSelector: { pinecall.io/pool: {{ . }} }
      tolerations:
        - { key: pinecall.io/pool, operator: Equal, value: {{ . }}, effect: NoSchedule }
      {{- end }}
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: runner
          image: "{{ required "image.repository" $.Values.image.repository }}:{{ required "image.tag" $.Values.image.tag }}{{ with $.Values.image.digest }}@{{ . }}{{ end }}"
          command: ["sh", "-c", 'PINECALL_RUNNER_KEY="$(cat /run/secrets/runner/key)" exec pinecall-runtime runner start']
          env:
            - { name: PINECALL_GATEWAY_URL, value: {{ required "gatewayUrl" $.Values.gatewayUrl | quote }} }
            - { name: PINECALL_RUNNER_IMAGE, value: {{ $.Values.appImage | quote }} }
            - { name: PINECALL_RUNNER_RUNTIME_CLASS, value: {{ $.Values.runtimeClass | quote }} }
            {{- with $.Values.appCpu }}
            - { name: PINECALL_RUNNER_APP_CPU, value: {{ . | quote }} }
            {{- end }}
            - { name: PINECALL_RUNNER_NAMESPACE, value: {{ $.Values.appsNamespace | quote }} }
            - { name: PINECALL_RUNNER_SOURCES_URL, value: "http://{{ required (printf "envs.%s.address" $env) $runner.address }}:8080" }
            - { name: PINECALL_RUNNER_LISTEN, value: 0.0.0.0 }
            - { name: PINECALL_RUNNER_PORT, value: "8080" }
          ports: [{ name: sources, containerPort: 8080 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: 250m, memory: 512Mi }
          volumeMounts:
            - { name: key, mountPath: /run/secrets/runner, readOnly: true }
            # The root is read-only; the runtime asks for a temporary directory when it loads.
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
        - name: key
          {{- if $synced }}
          secret: { secretName: runner-key-{{ $env }} }
          {{- else }}
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes: { secretProviderClass: runner-key-{{ $env }} }
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: runner-{{ $env }}
spec:
  clusterIP: {{ $runner.address }}
  selector: { app: runner, world: {{ $env }} }
  ports: [{ name: sources, port: 8080, targetPort: 8080 }]
{{- end }}
