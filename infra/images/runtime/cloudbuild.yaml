# The runtime's image, built whole by Cloud Build from one commit's tree (the context `make image`
# sends), checked before it is pushed: the package answers, every installed voice plugin imports
# for livekit's preload, and Smart Turn's weights are on the image offline.
steps:
  - name: gcr.io/cloud-builders/docker
    # BuildKit: the last stage mounts uv and the wheel for one step instead of keeping them.
    env: ["DOCKER_BUILDKIT=1"]
    args: ["build", "-f", "infra/images/runtime/Containerfile", "-t", "${_IMAGE}", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["run", "--rm", "${_IMAGE}", "--version"]
  - name: gcr.io/cloud-builders/docker
    args:
      - run
      - --rm
      - --entrypoint
      - python
      - ${_IMAGE}
      - -c
      - >-
        from pinecall_runtime.providers.service import installed; installed();
        from smart_turn_livekit.models import resolve_model;
        print(resolve_model('smart-turn-v3', local_only=True))
images:
  - "${_IMAGE}"
options:
  logging: CLOUD_LOGGING_ONLY
