# The runtime's image, built whole by Cloud Build from one commit's tree (the context `make image`
# sends), checked before it is pushed: the package answers, every installed voice plugin imports
# for livekit's preload, Smart Turn's weights are on the image offline, and the far-voices model
# loads and takes a frame as the image's own user.
steps:
  - name: gcr.io/cloud-builders/docker
    # BuildKit: the last stage mounts uv and the wheel for one step instead of keeping them.
    env: ["DOCKER_BUILDKIT=1"]
    args: ["build", "-f", "infra/images/runtime/Containerfile", "-t", "${_IMAGE}", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["run", "--rm", "${_IMAGE}", "--version"]
  - name: gcr.io/cloud-builders/docker
    args:
      - run
      - --rm
      - --entrypoint
      - python
      - ${_IMAGE}
      - -c
      - >-
        from runtime.providers.service.plugins import list_vendors; list_vendors();
        from smart_turn_livekit.models import resolve_model;
        print(resolve_model('smart-turn-v3', local_only=True));
        import os, pathlib; from livekit import rtc; from runtime.session.far_voices import load_far_voices;
        model = load_far_voices(pathlib.Path(os.environ['PINECALL_FAR_VOICES_LIBRARY']), pathlib.Path(os.environ['PINECALL_FAR_VOICES_MODEL']));
        assert model is not None, 'the far-voices model did not load';
        frame = rtc.AudioFrame(data=bytes(2400), sample_rate=24000, num_channels=1, samples_per_channel=1200);
        stream = model.open_stream(); assert stream.clear(frame) is not frame and not stream.broken, 'the far-voices model took no frame';
        print('far voices: a frame taken')
images:
  - "${_IMAGE}"
options:
  logging: CLOUD_LOGGING_ONLY
