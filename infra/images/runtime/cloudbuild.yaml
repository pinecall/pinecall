# The runtime's image, built whole by Cloud Build from one commit's tree (the context `make image`
# sends), checked before it is pushed: the package answers, every installed voice plugin imports
# for livekit's preload, Smart Turn's weights are on the image offline, and a call's two small models
# each load and take a frame as the image's own user.
steps:
  - name: gcr.io/cloud-builders/docker
    # BuildKit: the last stage mounts uv and the wheel for one step instead of keeping them.
    env: ["DOCKER_BUILDKIT=1"]
    args: ["build", "-f", "infra/images/runtime/Containerfile", "-t", "${_IMAGE}", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["run", "--rm", "${_IMAGE}", "--version"]
  - name: gcr.io/cloud-builders/docker
    args:
      - run
      - --rm
      - --entrypoint
      - python
      - ${_IMAGE}
      - -c
      - >-
        from runtime.providers.service.plugins import list_vendors; list_vendors();
        from smart_turn_livekit.models import resolve_model;
        print(resolve_model('smart-turn-v3', local_only=True));
        import os, pathlib; from livekit import rtc;
        frame = rtc.AudioFrame(data=bytes(2400), sample_rate=24000, num_channels=1, samples_per_channel=1200);
        from runtime.session.taking_the_floor import load_floor_model;
        floor = load_floor_model(pathlib.Path(os.environ['PINECALL_FLOOR_MODEL']));
        assert floor is not None, 'the floor model did not load';
        overlap = floor.open_stream(); overlap.hear(frame, agent_speaks=True); overlap.hear(frame, agent_speaks=True);
        assert len(overlap.recent) > 0, 'the floor model judged no frame';
        print('the floor: a frame judged')
images:
  - "${_IMAGE}"
options:
  logging: CLOUD_LOGGING_ONLY
