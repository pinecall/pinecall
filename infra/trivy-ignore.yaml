# What trivy finds in infra/ and in the charts as released (check.yml, `supply chain`) and is let
# stand, each by its path and with why. A finding not here fails the check. Those with a date are
# owed, not accepted: past it the check fails again until they are fixed or a reason replaces it.
misconfigurations:
  # By design.
  - id: KSV-0009
    paths:
      - pinecall/templates/livekit.yaml
      - pinecall/templates/sip.yaml
    statement: >-
      A world's LiveKit and SIP hold its media node's ports and announce the node's one address
      (charts/pinecall livekit.yaml, sip.yaml): a pod network would put NAT between them and the
      caller's media.
  - id: GCP-0048
    paths:
      - terraform/google/modules/gke/main.tf
    statement: >-
      The legacy metadata endpoints (v0.1, v1beta1) are disabled on every GKE node since 1.12 and
      were turned down for all of Compute Engine in 2020; setting the key by hand recreates the
      node pools for no change.
  - id: KSV-0014
    paths:
      - manifests/suite.yaml
    statement: >-
      The suite's Job writes its caches beside the checkout, and runs on a cluster that is not
      production's alone (`make suite` refuses CLUSTER=production).
  - id: KSV-0118
    paths:
      - manifests/suite.yaml
    statement: The suite's Job, never on production's cluster (`make suite` refuses CLUSTER=production).
  - id: DS-0002
    paths:
      - images/suite/Containerfile
      - local/postgres/Dockerfile
    statement: >-
      The suite's image (never on production's cluster) and the laptop's Postgres, whose
      entrypoint starts as root to own its data directory and drops to postgres itself.
  - id: AWS-0164
    paths:
      - terraform/aws/modules/network/main.tf
      - terraform/aws/server/main.tf
    statement: >-
      Every node holds a public address, as on Google Cloud: LiveKit and SIP announce their node's
      own, and with no private subnet there is no NAT gateway billed by the hour and the gigabyte.
      What reaches a node is its security group's to say (modules/eks, modules/edge, modules/hosting);
      a server's two machines are the same, each behind a group of its own (terraform/aws/server).
  - id: GCP-0031
    paths:
      - terraform/google/server/machines.tf
    statement: >-
      A server's machine is the address its callers reach: Caddy, LiveKit's media and SIP answer on
      it, and the apps' machine reaches the registries an app installs from with no NAT to pay for.
      What reaches either is its firewall rules' to say, by its tag (terraform/google/server/main.tf):
      the apps' machine has no rule but Identity-Aware Proxy's to port 22.
  - id: AWS-0104
    paths:
      - terraform/aws/server/main.tf
    statement: >-
      A server calls out to whoever its orgs chose: the vendors of each agent's voice and model, the
      carriers, an org's own webhooks, and the apps' machine to the registries an app installs from.
      No list of addresses says that, so what leaves is not fenced; what arrives is, rule by rule.
  - id: AWS-0040
    paths:
      - terraform/aws/modules/eks/main.tf
    statement: >-
      The cluster's API answers the internet because `make` runs on the operators' machines, with
      no network of the cluster's to be inside of; it lets in whoever IAM names (access entries),
      and the nodes reach it inside the VPC.
  - id: AWS-0031
    paths:
      - terraform/aws/project/registry.tf
    statement: >-
      A tag is a commit, and the suites' image is built again at one commit as the checkout
      changes; a release names the digest the registry holds for its tag (`make deploy`), which
      no push can move.
  - id: AWS-0132
    paths:
      - terraform/aws/bootstrap/main.tf
      - terraform/aws/modules/backups/main.tf
      - terraform/aws/project/build.tf
      - terraform/aws/server/backups.tf
    statement: >-
      The state's, the backups' and the builds' buckets are encrypted at rest under S3's own keys,
      as Google's are under Google's; each is private, and read by the one role that needs it.

  # The operator's call, owed by the date below: a list that is wrong locks them out.
  - id: AWS-0041
    paths:
      - terraform/aws/modules/eks/main.tf
    statement: >-
      The Kubernetes API is reached by IAM alone until the networks it answers are chosen
      (`api_sources`): a list that forgets the place the operator works from locks them out.
    expired_at: 2026-12-07
  - id: GCP-0061
    paths:
      - terraform/google/modules/gke/main.tf
    statement: >-
      The Kubernetes API is reached by IAM alone until authorized networks are chosen: a list
      that forgets the place the operator works from locks them out.
    expired_at: 2026-12-07
