<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pinecall widget</title>
  <style>body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #fff; }</style>
</head>
<body>
  <!-- Point token-url, code-url and dictation-url at your own endpoints: README.md, "Your endpoints". -->
  <script type="module" src="./pinecall-widget.js"></script>
  <pinecall-widget agent="pip" name="Pip" company="Brightside Dental"
                   greeting="Hi, I'm Pip. Shall I find you a time for a cleaning?"
                   token-url="/pinecall/token" code-url="/pinecall/code" dictation-url="/pinecall/dictation"></pinecall-widget>
</body>
</html>
