# gitleaks' own rules, and the values of this repository they mistake for a key.
[extend]
useDefault = true

[[allowlists]]
description = "RFC 6455's sample nonce ('the sample nonce' in base64), the Sec-WebSocket-Key sdk/typescript/test/client/fakes.test.ts sends by hand"
regexes = ['''dGhlIHNhbXBsZSBub25jZQ==''']

[[allowlists]]
description = "The CLI suite's fake gateway key: hex counting 0 to f twice, opening nothing (cli/test/support/gateway.ts)"
regexes = ['''pc_live_0123456789abcdef0123456789abcdef''']

[[allowlists]]
description = "The Ruby suite's fake key, 'key of find me if anybody prints it' in leetspeak: what no inspect may print (sdk/ruby/test/client/inspect_test.rb)"
regexes = ['''pc_live_k3y0f1ndm3if4nyb0dyp1nt5it''']

[[allowlists]]
description = "A constant's name, how long a sign-in is kept, passed by keyword beside a variable named `key` (runtime/src/runtime/accounts/service/actor.py)"
regexes = ['''kept=A_SIGN_IN_IS_KEPT''']

[[allowlists]]
description = "The hosted MCP server's suite's fake key: hex counting 0 to f twice, opening nothing (mcp/test/server.test.ts)"
regexes = ['''pk_0123456789abcdef0123456789abcdef''']
