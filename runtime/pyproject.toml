[project]
name = "pinecall-runtime"
version = "0.11.5"
description = "The Pinecall runtime: the gateway that answers the API and the worker that runs the calls, on LiveKit."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
authors = [{ name = "Pinecall", email = "hello@pinecall.io" }]
classifiers = [
  "Typing :: Typed",
  "Programming Language :: Python :: 3.13",
  "Framework :: FastAPI",
]

dependencies = [
  "fastapi>=0.120,<1",
  "uvicorn[standard]>=0.37,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0.43,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.16,<2",
  "alembic-utils>=0.8.8,<1",
  "pgvector>=0.4,<1",
  "redis>=6,<7",
  "httpx>=0.28,<1",
  "websockets>=15,<16",
  "cryptography>=50,<51",
  "pyjwt[crypto]>=2.10,<3",
  "argon2-cffi>=25,<26",
  "structlog>=25,<27",
  "apscheduler>=3.11,<4",
  # The text session is livekit's AgentSession with no audio: the library and its two llm plugins.
  "livekit-agents[anthropic,openai]>=1.8.3,<2",
  # Smart Turn v3, the row's alternative to livekit's own end-of-turn model: 8 MB of ONNX read
  # off the caller's audio on the worker's CPU, no transcript.
  "smart-turn-livekit[livekit]>=0.4,<1",
  "livekit-api>=1.2,<2",
  # A livekit client's room configuration is parsed with protobuf's own reader.
  "protobuf>=6,<8",
  # A call's recording: the room's other voices and the melody laid in (session/recording.py).
  "av>=15,<19",
  "numpy>=2,<3",
  # starlette's middleware and types are imported by name.
  "starlette>=0.47,<2",
  "phonenumbers>=9,<10",
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "python-dotenv>=1.1,<2",
  "dnspython>=2.7,<3",
  # The operator's terminal: a verb is a typed function, as an endpoint is (cli/).
  "typer>=0.15,<1",
  # `setup` at a terminal: a stage completed as it is typed, a secret typed without echo (cli/setup_ask.py).
  "prompt-toolkit>=3.0,<4",
]

[project.optional-dependencies]
voice = [
  "livekit-agents[assemblyai,asyncai,aws,azure,baseten,bland,cambai,cartesia,cerebras,clova,deepgram,elevenlabs,fal,fireworksai,fishaudio,gladia,gnani,google,gradium,groq,hume,inworld,lmnt,meta,minimax,mistralai,murf,neuphonic,nvidia,palabra,perplexity,resemble,respeecher,rime,rtzr,sarvam,simplismart,slng,smallestai,soniox,speechify,speechmatics,spitch,upliftai,vakyam,xai]>=1.8.3,<2",
  # livekit-plugins-upliftai imports socketio and does not declare it (1.8.3): without it the
  # plugin does not import, and Uplift AI is no vendor.
  "python-socketio>=5.11,<6",
  # livekit-plugins-clova reads audio through pydub, which imports audioop; Python 3.13 dropped it
  # from the standard library. Without this the plugin does not import, and Clova is no vendor.
  "audioop-lts>=0.2.1; python_version >= '3.13'",
]

[project.scripts]
pinecall-runtime = "pinecall_runtime.cli:main"

[project.urls]
Homepage = "https://pinecall.io"
Repository = "https://github.com/pinecall/pinecall"
Documentation = "https://docs.pinecall.io"

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "pytest-xdist>=3.8",
  "pytest-timeout>=2.4",
  "ruff>=0.13",
  "pyright>=1.1.405",
  "mypy>=1.17",
  "respx>=0.22",
  "time-machine>=2.19",
  "sqlacodegen>=3.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pinecall_runtime"]

# The console and the widget, built by scripts/console, ride in the wheel as pinecall_runtime/public.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "scripts/hatch_build.py"

[tool.uv]
managed = true

# ---------- tests ----------
# Every test runs in parallel on a real Postgres and a real Redis; livekit and the vendors are
# faked. The whole suite must finish under five minutes on the test machine: a test that needs
# more than ten seconds is a test that is doing a deploy's job.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -n auto --timeout=10 --strict-markers"
asyncio_mode = "auto"
# One loop for the suites and their fixtures: a connection a test opens is closed by the fixture
# that owns the engine, on the loop it was made on.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
xfail_strict = true
filterwarnings = ["error"]
markers = ["live: runs against a deployed gateway (never in CI's default run)"]

# ---------- typing: both, both strict ----------
[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
include = ["src", "tests"]
reportImplicitOverride = true
# The conventions suite holds the cycle rule on the module graph: pyright's counts the package
# __init__ every sibling import passes through, which the canon's `service/` packages all do.
reportImportCycles = false
reportPrivateUsage = false

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/.*"]
# livekit's LLM, STT and TTS bases are assigned to `type[...]` names on purpose: the plugins subclass them.
disable_error_code = ["type-abstract"]
# Two libraries without types, called where they are the only way: OpenTelemetry's exporters, redis's pubsub.
untyped_calls_exclude = ["opentelemetry", "redis"]

[[tool.mypy.overrides]]
module = ["smart_turn_livekit"]
ignore_missing_imports = true

# ---------- lint ----------
[tool.ruff]
# 120: a sentence of ours fits on one line, and `ruff format` wraps everything to it.
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pycodestyle, pyflakes
  "I",             # isort
  "B",             # bugbear
  "UP",            # pyupgrade
  "ARG",           # unused arguments
  "SIM",           # simplify
  # No TC: an import is one thing, run at import; dataclasses read their annotations, and a block
  # that lies to the checker about what runs is what the canon forbids.
  "T20",           # print
  "RUF",
  "D1",            # every public thing has a docstring
]
ignore = ["D107", "D105", "RUF012"]
# A heading path reads `Setup › Keys`; a word may hold a typographic apostrophe.
allowed-confusables = ["›", "’"]
unfixable = ["T20"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["pinecall_runtime", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D1", "ARG", "T20"]
"src/pinecall_runtime/migrations/**" = ["D1"]
# The load lab is a script a person runs: its lines are its output.
