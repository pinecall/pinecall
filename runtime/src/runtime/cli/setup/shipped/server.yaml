# The runtime as a server: laid over compose.yaml by `pinecall-runtime setup --domain <name>`. Everything
# runs in Docker and comes back after a reboot: Caddy answers the name with a certificate it renews
# itself and hands /rtc to LiveKit and the rest to the gateway; the gateway, a worker and an overflow
# per environment, the simulated callers and the night's retention run one image, this release of the package built here or
# the image `--image` named. Each one is on the host's network, so the services' loopback ports and
# the open models' are theirs as they are a laptop's; only Caddy (:80, :443), LiveKit's media (:7881
# tcp, :7882 udp) and, with --phone, SIP (:5060 and its RTP ports, `PINECALL_SIP_RTP_PORTS`) face out.
#
# Every process is confined as a cluster's pod is (charts/pinecall, `pinecall.podSecurity`): a user
# of its own that is not root, no capability, no privilege to gain, a root filesystem it cannot
# write. And each is handed what it reads and nothing else: the gateways the env file whole, but
# the database as the role that changes no table; a worker and an overflow no database, no Redis,
# no vault key, no operator's key and no signing key (tests/cli/setup/test_server_compose.py holds
# this file to it). Their values are the env file's (owner-only), never a file of their own.
x-confined: &confined
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  read_only: true

# One image, two makers: the Dockerfile beside this file and a commit's image from a registry both
# have the user 10001 and its home. What a process writes goes to /tmp (memory), its home (a volume)
# and the recordings' folder.
x-runtime: &runtime
  <<: *confined
  image: ${PINECALL_RUNTIME_IMAGE}
  entrypoint: ["pinecall-runtime"]
  user: "10001:10001"
  network_mode: host
  tmpfs: ["/tmp:size=1g"]
  volumes: ["${PINECALL_RECORDINGS}:${PINECALL_RECORDINGS}", "home:/home/pinecall"]
  # Every socket a gateway holds is a file: its callers' logs followed, its apps, its vendors, the
  # rooms of the callers it simulates. Docker's own limit is 1024, which one gateway ran out of on
  # 2026-11-24 and refused everything that needed a new one for thirteen minutes.
  ulimits: { nofile: { soft: 65536, hard: 65536 } }
  restart: unless-stopped

# A worker or an overflow answers on its health port once LiveKit has it (as a cluster's startup and
# liveness probes ask): compose waits for it, so `setup` and `local up` fail on a worker that does not
# start, and Docker starts one again that stops answering. Its first answer can take a minute (the
# warm process loads the turn and floor models).
x-answers-calls: &answers-calls
  test:
    - CMD
    - python
    - -c
    - "import os, urllib.request as r; r.urlopen('http://127.0.0.1:' + (os.environ.get('PINECALL_OVERFLOW_HTTP_PORT') or os.environ['PINECALL_WORKER_HTTP_PORT']) + '/', timeout=3)"
  interval: 10s
  timeout: 5s
  retries: 3
  start_period: 180s
  start_interval: 3s

# What a worker and an overflow read, name by name: their LiveKit and its pair, the name, where the
# recordings go, and how they log and pace a call. The fleet, the key and the seats are each one's.
x-worker-reads: &worker-reads
  LIVEKIT_URL: ${LIVEKIT_URL}
  LIVEKIT_SANDBOX_URL: ${LIVEKIT_SANDBOX_URL:-}
  LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-}
  LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
  LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
  PINECALL_DOMAIN: ${PINECALL_DOMAIN}
  PINECALL_GATEWAY_URL: http://127.0.0.1:8079
  PINECALL_RECORDINGS: ${PINECALL_RECORDINGS}
  PINECALL_RECORDINGS_BUCKET: ${PINECALL_RECORDINGS_BUCKET:-}
  PINECALL_S3_ENDPOINT: ${PINECALL_S3_ENDPOINT:-}
  PINECALL_S3_REGION: ${PINECALL_S3_REGION:-}
  PINECALL_S3_ACCESS_KEY_ID: ${PINECALL_S3_ACCESS_KEY_ID:-}
  PINECALL_S3_SECRET_ACCESS_KEY: ${PINECALL_S3_SECRET_ACCESS_KEY:-}
  PINECALL_IDLE_PROCESSES: "${PINECALL_IDLE_PROCESSES:-1}"
  PINECALL_OVERFLOW_SAYS: ${PINECALL_OVERFLOW_SAYS:-}
  PINECALL_TIMEZONE: ${PINECALL_TIMEZONE:-}
  PINECALL_LOG_LEVEL: ${PINECALL_LOG_LEVEL:-}
  PINECALL_OTLP_ENDPOINT: ${PINECALL_OTLP_ENDPOINT:-}
  PINECALL_OTLP_HEADERS: ${PINECALL_OTLP_HEADERS:-}
  PINECALL_OTLP_PII: ${PINECALL_OTLP_PII:-}
  PINECALL_VOICE_LOOKUP_BUDGET_MS: ${PINECALL_VOICE_LOOKUP_BUDGET_MS:-}
  PINECALL_TEXT_LOOKUP_BUDGET_MS: ${PINECALL_TEXT_LOOKUP_BUDGET_MS:-}
  PINECALL_REMEMBER_BUDGET_S: ${PINECALL_REMEMBER_BUDGET_S:-}
  PINECALL_MAX_TOOL_STEPS: ${PINECALL_MAX_TOOL_STEPS:-}

services:
  # Postgres and Redis as their images' own users, Redis asking a password: a worker shares this
  # machine's loopback with them and holds neither's. Postgres's socket is a volume, so the backups
  # beside it are let in as its own user and no password is written for them.
  postgres:
    <<: *confined
    user: "999:999"
    tmpfs: ["/tmp"]
    volumes: ["postgres-socket:/var/run/postgresql"]

  redis:
    <<: *confined
    user: "999:1000"
    command: ["redis-server", "--requirepass", "${PINECALL_REDIS_PASSWORD:?a server's Redis asks a password, drawn by setup}"]
    volumes: ["redis:/data"]

  # Caddy as the runtime's user, with one capability: to take ports 80 and 443 on the host's network.
  # Its binary holds that capability as a file's, which no-new-privileges would refuse it.
  caddy:
    profiles: [server]
    image: docker.io/library/caddy:2.11.7@sha256:685ae3d7c34d9b5f8caeddc5d14051db7bbd88ff1f5a2fa0c16bd8ca328fb7af
    network_mode: host
    user: "10001:10001"
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs: ["/tmp"]
    # sites/ is the operator's own: a site of theirs beside the runtime's, never written by setup.
    volumes:
      - "./Caddyfile:/etc/caddy/Caddyfile:ro"
      - "./sites:/etc/caddy/sites:ro"
      - "caddy-data:/data"
      - "caddy-config:/config"
    restart: unless-stopped

  # What the runtime's processes write is theirs: the recordings' folder and Caddy's certificates,
  # which a server before 2026-11-23 wrote as root. Run once before the others by every `setup` and
  # `local up`, as root with no capability but to change an owner and to look into a folder, and no
  # network; it changes nothing when everything is theirs already.
  own:
    <<: *confined
    profiles: [server]
    image: ${PINECALL_RUNTIME_IMAGE}
    pull_policy: never
    user: "0:0"
    cap_add: [CHOWN, DAC_READ_SEARCH]
    network_mode: none
    entrypoint: ["find"]
    command: ["/own/recordings", "/own/caddy-data", "/own/caddy-config", "!", "-uid", "10001", "-exec", "chown", "-h", "10001:10001", "{}", "+"]
    volumes:
      - "${PINECALL_RECORDINGS}:/own/recordings"
      - "caddy-data:/own/caddy-data"
      - "caddy-config:/own/caddy-config"
    restart: "no"

  # The LiveKit setup starts on a server: the media on the machine's public address, the pair drawn
  # for this machine, the webhook to the gateway on loopback. Not started with --livekit. Its config
  # is said here from the env file's values, so no file of the machine holds its secret but that one.
  livekit-server:
    <<: *confined
    profiles: [server-livekit]
    image: docker.io/livekit/livekit-server:v1.13.7@sha256:6fd3b7088874c4d119160dd688798dfec852bc014786d392caad15f6f63912a3
    user: "10001:10001"
    tmpfs: ["/tmp"]
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: true
        redis:
          address: 127.0.0.1:56380
          password: ${PINECALL_REDIS_PASSWORD:?a server's Redis asks a password, drawn by setup}
        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - http://127.0.0.1:8079/v1/livekit/webhook
        logging:
          level: info
    network_mode: host
    restart: unless-stopped
    depends_on: [redis]

  # LiveKit's SIP: calls to this machine's :5060, their audio on its RTP ports, a call each.
  sip-server:
    <<: *confined
    profiles: [server-phone]
    image: docker.io/livekit/sip:v1.17.0@sha256:d3c6441eb0918a81ab9e48ba7df6f02c1eebbeace42c963b2c6a6e5418675671
    user: "10001:10001"
    tmpfs: ["/tmp"]
    # The image's entrypoint names a config file; this one reads its config from SIP_CONFIG_BODY.
    entrypoint: ["livekit-sip"]
    environment:
      SIP_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://127.0.0.1:7880
        redis:
          address: 127.0.0.1:56380
          password: ${PINECALL_REDIS_PASSWORD:?a server's Redis asks a password, drawn by setup}
        sip_port: 5060
        rtp_port: ${PINECALL_SIP_RTP_PORTS:-10000-10019}
        use_external_ip: true
        logging:
          level: info
    network_mode: host
    restart: unless-stopped
    depends_on: [livekit-server]

  # The base backups of a server that names a place for them (`PINECALL_BACKUP_URL`): Postgres's own
  # image beside its data, a backup when the place holds none and one a night after.
  postgres-backup:
    <<: *confined
    profiles: [server-backups]
    image: pinecall/postgres:17-pgvector0.8.6-pgtextsearch1.4.0
    pull_policy: never
    user: "999:999"
    tmpfs: ["/tmp"]
    command: ["backup-nightly"]
    environment:
      PINECALL_BACKUP_URL: ${PINECALL_BACKUP_URL:-}
      PINECALL_BACKUP_AT: ${PINECALL_BACKUP_AT:-03:00}
      PINECALL_BACKUP_DAYS: ${PINECALL_BACKUP_DAYS:-35}
    env_file: [{path: ./backups.env, required: false}]
    volumes: ["postgres:/var/lib/postgresql/data:ro", "postgres-socket:/var/run/postgresql"]
    restart: unless-stopped
    depends_on: [postgres]

  # Two gateways, as a cluster has: a run of `setup` or `local up` starts one again while the other
  # answers, then the other, so the name does not stop answering through an update (one gateway was
  # away the half minute it takes to start). Caddy sends each request to one that is up, the
  # browser's and, on a port of loopback, the workers' and LiveKit's too. Each says it answers
  # before compose goes on to the next. A gateway reaches Postgres as the role that reads and
  # writes rows and changes no table; the migrations are setup's, as the database's owner.
  gateway:
    <<: *runtime
    profiles: [server]
    build:
      context: ./runtime
      args: {SPEC: "${PINECALL_RUNTIME_SPEC}"}
    command: ["gateway"]
    env_file: ./env
    environment:
      DATABASE_URL: "${PINECALL_DB_APP_URL:?a server's gateway connects as the app's role, made by setup}"
      PINECALL_CALLERS_SERVICE: "1"
    healthcheck: &answers
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request as r; r.urlopen('http://' + os.environ.get('PINECALL_GATEWAY_LISTEN', '127.0.0.1:8080') + '/.well-known/pinecall', timeout=3)"
      interval: 3s
      timeout: 5s
      retries: 60

  gateway-b:
    <<: *runtime
    profiles: [server]
    pull_policy: never
    command: ["gateway"]
    env_file: ./env
    environment:
      DATABASE_URL: "${PINECALL_DB_APP_URL:?a server's gateway connects as the app's role, made by setup}"
      PINECALL_CALLERS_SERVICE: "1"
      PINECALL_GATEWAY_LISTEN: 127.0.0.1:8081
    healthcheck: *answers

  # The callers of spoken simulations, played here and by no gateway (`PINECALL_CALLERS_SERVICE` on
  # both): several processes, each one loop with nothing on it but the few callers it claimed, so a
  # caller's voice reaches its room on time however many calls are simulated at once. A gateway
  # started again ends none of them. Its processes are `PINECALL_CALLER_PROCESSES`, else half the
  # machine's cores, each playing `PINECALL_CALLERS_PER_PROCESS` callers at once, two unless said.
  # It answers nothing and listens on nothing. It is handed what playing a caller reads, by name: the
  # database as the app's role, Redis, the vault for the caller's vendors' keys, what signs its way
  # into a room, LiveKit and the names a phone leg dials. Told to stop, each process claims no other
  # caller and ends with the calls it plays, eleven minutes at most: a caller cut then says so on its
  # row, and its call is played again or says why.
  callers:
    <<: *runtime
    profiles: [server]
    pull_policy: never
    command: ["callers", "start"]
    environment:
      DATABASE_URL: "${PINECALL_DB_APP_URL:?a server's callers connect as the app's role, made by setup}"
      PINECALL_REDIS_URL: ${PINECALL_REDIS_URL}
      PINECALL_VAULT_KEY: ${PINECALL_VAULT_KEY}
      PINECALL_TOKEN_KEY: ${PINECALL_TOKEN_KEY}
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_SANDBOX_URL: ${LIVEKIT_SANDBOX_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      PINECALL_DOMAIN: ${PINECALL_DOMAIN}
      PINECALL_SIP_DOMAIN: ${PINECALL_SIP_DOMAIN:-}
      PINECALL_SANDBOX_SIP_DOMAIN: ${PINECALL_SANDBOX_SIP_DOMAIN:-}
      PINECALL_CALLER_PROCESSES: ${PINECALL_CALLER_PROCESSES:-}
      PINECALL_CALLERS_PER_PROCESS: ${PINECALL_CALLERS_PER_PROCESS:-}
      PINECALL_TIMEZONE: ${PINECALL_TIMEZONE:-}
      PINECALL_LOG_LEVEL: ${PINECALL_LOG_LEVEL:-}
    stop_grace_period: 12m
    depends_on: [gateway]

  # A worker an environment. Its seats are the env file's: `PINECALL_<ENV>_MAX_JOBS`, else
  # `PINECALL_MAX_JOBS`. Told to stop, it takes no new call and ends when the last one it holds does:
  # ten minutes at most, the worker's own drain, where Docker's ten seconds cut every call in flight.
  # It keeps one process warm for the next call, as a cluster's does (livekit's own count is one a
  # core, each a gibibyte), and knocks at whichever gateway is up, through Caddy's port of loopback.
  worker-sandbox:
    <<: *runtime
    profiles: [server]
    pull_policy: never
    command: ["worker", "start"]
    environment:
      <<: *worker-reads
      PINECALL_FLEET: pinecall-sandbox
      PINECALL_WORKER_KEY: ${PINECALL_SANDBOX_FLEET_KEY}
      PINECALL_MAX_JOBS: "${PINECALL_SANDBOX_MAX_JOBS:-${PINECALL_MAX_JOBS:-4}}"
      PINECALL_WORKER_HTTP_PORT: "8182"
    stop_grace_period: 10m
    healthcheck: *answers-calls
    depends_on: [gateway]

  worker-production:
    <<: *runtime
    profiles: [server]
    pull_policy: never
    command: ["worker", "start"]
    environment:
      <<: *worker-reads
      PINECALL_FLEET: pinecall
      PINECALL_WORKER_KEY: ${PINECALL_PRODUCTION_FLEET_KEY}
      PINECALL_MAX_JOBS: "${PINECALL_PRODUCTION_MAX_JOBS:-${PINECALL_MAX_JOBS:-4}}"
      PINECALL_WORKER_HTTP_PORT: "8183"
    stop_grace_period: 10m
    healthcheck: *answers-calls
    depends_on: [gateway]

  # Who answers the call no worker has a seat for: one sentence and a call back offered, where a
  # server with none left that caller in silence. It answers its health on a port of loopback.
  overflow-sandbox:
    <<: *runtime
    profiles: [server]
    pull_policy: never
    command: ["worker", "overflow"]
    environment:
      <<: *worker-reads
      PINECALL_FLEET: pinecall-sandbox
      PINECALL_OVERFLOW_HTTP_PORT: "8184"
      PINECALL_WORKER_KEY: ${PINECALL_SANDBOX_FLEET_KEY}
    stop_grace_period: 2m
    healthcheck: *answers-calls
    depends_on: [gateway]

  overflow-production:
    <<: *runtime
    profiles: [server]
    pull_policy: never
    command: ["worker", "overflow"]
    environment:
      <<: *worker-reads
      PINECALL_FLEET: pinecall
      PINECALL_OVERFLOW_HTTP_PORT: "8185"
      PINECALL_WORKER_KEY: ${PINECALL_PRODUCTION_FLEET_KEY}
    stop_grace_period: 2m
    healthcheck: *answers-calls
    depends_on: [gateway]

  # The night's work, which a cluster gives a CronJob: the calls past their org's days erased, what
  # is kept for a time forgotten, the log's days made ahead. Once a day, at 04:00 UTC. It reads the
  # database as its owner (a day of the log is a table it makes and drops), the vault for a
  # recording's key, and where the recordings are; nothing else.
  retention:
    <<: *runtime
    profiles: [server]
    pull_policy: never
    command: ["retention", "nightly"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PINECALL_VAULT_KEY: ${PINECALL_VAULT_KEY}
      PINECALL_RECORDINGS: ${PINECALL_RECORDINGS}
      PINECALL_RECORDINGS_BUCKET: ${PINECALL_RECORDINGS_BUCKET:-}
      PINECALL_S3_ENDPOINT: ${PINECALL_S3_ENDPOINT:-}
      PINECALL_S3_REGION: ${PINECALL_S3_REGION:-}
      PINECALL_S3_ACCESS_KEY_ID: ${PINECALL_S3_ACCESS_KEY_ID:-}
      PINECALL_S3_SECRET_ACCESS_KEY: ${PINECALL_S3_SECRET_ACCESS_KEY:-}
      PINECALL_TIMEZONE: ${PINECALL_TIMEZONE:-}
      PINECALL_LOG_LEVEL: ${PINECALL_LOG_LEVEL:-}
    depends_on: [gateway]

volumes:
  caddy-data:
  caddy-config:
  home:
  redis:
  postgres-socket:
