# The runtime as a server: laid over compose.yaml by `pinecall-runtime setup --domain <name>`. Everything
# runs in Docker and comes back after a reboot: Caddy answers the name with a certificate it renews
# itself and hands /rtc to LiveKit and the rest to the gateway; the gateway, a worker and an overflow
# per environment and the night's retention run one image, this release of the package built here or
# the image `--image` named. Each one is on the host's network, so the services' loopback ports and
# the open models' are theirs as they are a laptop's; only Caddy (:80, :443), LiveKit's media (:7881
# tcp, :7882 udp) and, with --phone, SIP (:5060 and its RTP ports, `PINECALL_SIP_RTP_PORTS`) face out.
#
# One image, two makers: the Dockerfile beside this file runs as root with no entrypoint, a commit's
# image from a registry as its own user under `pinecall-runtime`. The entrypoint and the user are
# said here, so either runs every service the same way and writes the recordings' folder.
x-runtime: &runtime
  image: ${PINECALL_RUNTIME_IMAGE}
  entrypoint: ["pinecall-runtime"]
  user: "0:0"
  network_mode: host
  env_file: ./env
  volumes: ["${PINECALL_RECORDINGS}:${PINECALL_RECORDINGS}", "cache:/root/.cache"]
  restart: unless-stopped

services:
  caddy:
    profiles: [server]
    image: docker.io/library/caddy:2.11.7@sha256:685ae3d7c34d9b5f8caeddc5d14051db7bbd88ff1f5a2fa0c16bd8ca328fb7af
    network_mode: host
    # sites/ is the operator's own: a site of theirs beside the runtime's, never written by setup.
    volumes:
      - "./Caddyfile:/etc/caddy/Caddyfile:ro"
      - "./sites:/etc/caddy/sites:ro"
      - "caddy-data:/data"
      - "caddy-config:/config"
    restart: unless-stopped

  # The LiveKit setup starts on a server: the media on the machine's public address, the pair drawn
  # for this machine, the webhook to the gateway on loopback. Not started with --livekit.
  livekit-server:
    profiles: [server-livekit]
    image: docker.io/livekit/livekit-server:v1.13.7@sha256:6fd3b7088874c4d119160dd688798dfec852bc014786d392caad15f6f63912a3
    command: ["--config", "/etc/livekit.yaml"]
    volumes: ["./livekit.server.yaml:/etc/livekit.yaml:ro"]
    network_mode: host
    restart: unless-stopped
    depends_on: [redis]

  sip-server:
    profiles: [server-phone]
    image: docker.io/livekit/sip:v1.17.0@sha256:d3c6441eb0918a81ab9e48ba7df6f02c1eebbeace42c963b2c6a6e5418675671
    network_mode: host
    # The image reads its config at /sip/config.yaml.
    volumes: ["./sip.server.yaml:/sip/config.yaml:ro"]
    restart: unless-stopped
    depends_on: [livekit-server]

  # The base backups of a server that names a place for them (`PINECALL_BACKUP_URL`): Postgres's own
  # image beside its data, a backup when the place holds none and one a night after.
  postgres-backup:
    profiles: [server-backups]
    image: pinecall/postgres:17-pgvector0.8.6-pgtextsearch1.4.0
    pull_policy: never
    user: postgres
    command: ["backup-nightly"]
    environment:
      PGPASSWORD: pinecall
      PINECALL_BACKUP_URL: ${PINECALL_BACKUP_URL:-}
      PINECALL_BACKUP_AT: ${PINECALL_BACKUP_AT:-03:00}
      PINECALL_BACKUP_DAYS: ${PINECALL_BACKUP_DAYS:-35}
    env_file: [{path: ./backups.env, required: false}]
    volumes: ["postgres:/var/lib/postgresql/data:ro"]
    restart: unless-stopped
    depends_on: [postgres]

  # Two gateways, as a cluster has: a run of `setup` or `local up` starts one again while the other
  # answers, then the other, so the name does not stop answering through an update (one gateway was
  # away the half minute it takes to start). Caddy sends each request to one that is up, the
  # browser's and, on a port of loopback, the workers' and LiveKit's too. Each says it answers
  # before compose goes on to the next.
  gateway:
    <<: *runtime
    profiles: [server]
    build:
      context: ./runtime
      args: {SPEC: "${PINECALL_RUNTIME_SPEC}"}
    command: ["gateway"]
    healthcheck: &answers
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request as r; r.urlopen('http://' + os.environ.get('PINECALL_GATEWAY_LISTEN', '127.0.0.1:8080') + '/.well-known/pinecall', timeout=3)"
      interval: 3s
      timeout: 5s
      retries: 60

  gateway-b:
    <<: *runtime
    profiles: [server]
    pull_policy: never
    command: ["gateway"]
    environment:
      PINECALL_GATEWAY_LISTEN: 127.0.0.1:8081
    healthcheck: *answers

  # A worker an environment. Its seats are the env file's: `PINECALL_<ENV>_MAX_JOBS`, else
  # `PINECALL_MAX_JOBS`. Told to stop, it takes no new call and ends when the last one it holds does:
  # ten minutes at most, the worker's own drain, where Docker's ten seconds cut every call in flight.
  # It keeps one process warm for the next call, as a cluster's does (livekit's own count is one a
  # core, each a gibibyte), and knocks at whichever gateway is up, through Caddy's port of loopback.
  worker-sandbox:
    <<: *runtime
    profiles: [server]
    pull_policy: never
    command: ["worker", "start"]
    environment:
      PINECALL_FLEET: pinecall-sandbox
      PINECALL_GATEWAY_URL: http://127.0.0.1:8079
      PINECALL_MAX_JOBS: "${PINECALL_SANDBOX_MAX_JOBS:-${PINECALL_MAX_JOBS:-4}}"
      PINECALL_IDLE_PROCESSES: "${PINECALL_IDLE_PROCESSES:-1}"
      PINECALL_WORKER_HTTP_PORT: "8182"
    stop_grace_period: 10m
    depends_on: [gateway]

  worker-production:
    <<: *runtime
    profiles: [server]
    pull_policy: never
    command: ["worker", "start"]
    environment:
      PINECALL_FLEET: pinecall
      PINECALL_WORKER_KEY: ${PINECALL_PRODUCTION_FLEET_KEY}
      PINECALL_GATEWAY_URL: http://127.0.0.1:8079
      PINECALL_MAX_JOBS: "${PINECALL_PRODUCTION_MAX_JOBS:-${PINECALL_MAX_JOBS:-4}}"
      PINECALL_IDLE_PROCESSES: "${PINECALL_IDLE_PROCESSES:-1}"
      PINECALL_WORKER_HTTP_PORT: "8183"
    stop_grace_period: 10m
    depends_on: [gateway]

  # Who answers the call no worker has a seat for: one sentence and a call back offered, where a
  # server with none left that caller in silence. It listens on a free port of loopback.
  overflow-sandbox:
    <<: *runtime
    profiles: [server]
    pull_policy: never
    command: ["worker", "overflow"]
    environment:
      PINECALL_FLEET: pinecall-sandbox
      PINECALL_GATEWAY_URL: http://127.0.0.1:8079
    stop_grace_period: 2m
    depends_on: [gateway]

  overflow-production:
    <<: *runtime
    profiles: [server]
    pull_policy: never
    command: ["worker", "overflow"]
    environment:
      PINECALL_FLEET: pinecall
      PINECALL_WORKER_KEY: ${PINECALL_PRODUCTION_FLEET_KEY}
      PINECALL_GATEWAY_URL: http://127.0.0.1:8079
    stop_grace_period: 2m
    depends_on: [gateway]

  # The night's work, which a cluster gives a CronJob: the calls past their org's days erased, what
  # is kept for a time forgotten, the log's days made ahead. Once a day, at 04:00 UTC.
  retention:
    <<: *runtime
    profiles: [server]
    pull_policy: never
    command: ["retention", "nightly"]
    depends_on: [gateway]

volumes:
  caddy-data:
  caddy-config:
  cache:
